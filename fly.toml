# Kara on Fly — one always-warm machine, mirroring the Modal setup.
# The turn guards and session state are in-process: keep exactly ONE machine
# (deploy with --ha=false) and never auto-stop it.
app = "kara-3"
primary_region = "iad"

[build]

[env]
  PORT = "8000"
  # Demo brain (fast, keyword-matched template serving) is the default for
  # general users. Work-trial applicants on /data/applicants.txt still get the
  # full brain via the allowlist (see entitlements.js / fast-brain.js:709).
  # Was "0" (full brain for everyone) but that made template serving slow —
  # Sonnet doing list/read/publish round-trips or building from scratch.
  DEMO_MODE = "1"
  # Work-trial allowlist lives on the volume: editable via fly ssh, no redeploy
  APPLICANTS_FILE = "/data/applicants.txt"
  # Brain runs on the user's Fireworks account (Anthropic cost). deepseek-v4-flash
  # was the fastest Fireworks model measured for the demo path (~0.9-1.5s warm).
  # Brand swaps happen server-side via publish_template's `brand` param, so a
  # fast/weaker model can't get the branding wrong. FIREWORKS_API_KEY is a fly
  # secret. NOTE: this routes ALL turns through Fireworks — the applicant full
  # brain and the background researcher lose web_search/computer (stripped on
  # Fireworks); acceptable while Fireworks is primary.
  MODEL_PROVIDER = "fireworks"
  FIREWORKS_MODEL = "accounts/fireworks/models/deepseek-v4-flash"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "kara_data"
  destination = "/data"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
