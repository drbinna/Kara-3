<!-- desc: Dark event / launch announcement page: date-forward hero with countdown feel (static), what-to-expect agenda rows, venue line, RSVP mailto button. Deep navy with electric accent, no images required. Swappable strings: event name "Signal Night", date line "Friday, October 9", venue "The Foundry, San Francisco", tagline "An evening of demos from people building the future in public.", agenda items "7:00 — Doors + drinks" / "7:45 — Six demos, ten minutes each" / "9:30 — Afterglow", rsvp email "rsvp@signalnight.co". -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Night</title>
<style>
  :root{--bg:#0b1020;--ink:#eef1fa;--mut:#9aa3c0;--acc:#5eead4;--line:rgba(255,255,255,.12)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.6;min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:80px 24px}
  .date{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--acc);font-weight:700;text-align:center}
  h1{text-align:center;font-size:clamp(3rem,11vw,5.2rem);letter-spacing:-.03em;line-height:1;margin:18px 0 14px}
  .tag{text-align:center;color:var(--mut);font-size:17px;max-width:460px;margin:0 auto}
  .venue{text-align:center;margin-top:18px;font-size:14px;color:var(--ink)}
  .venue span{color:var(--acc)}
  .agenda{margin:56px 0;border-top:1px solid var(--line)}
  .row{display:flex;gap:22px;padding:20px 4px;border-bottom:1px solid var(--line);align-items:baseline}
  .row .t{font-variant-numeric:tabular-nums;color:var(--acc);font-weight:700;font-size:15px;min-width:64px}
  .row .what{font-size:17px}
  .rsvp{text-align:center;margin-top:48px}
  .rsvp a{display:inline-block;background:var(--acc);color:#06251f;text-decoration:none;font-weight:800;font-size:15px;padding:15px 44px;border-radius:999px}
  .rsvp p{color:var(--mut);font-size:13px;margin-top:14px}
  footer{text-align:center;color:var(--mut);font-size:12px;margin-top:70px;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="wrap">
    <div class="date">Friday, October 9</div>
    <h1>Signal Night</h1>
    <p class="tag">An evening of demos from people building the future in public.</p>
    <p class="venue">at <span>The Foundry, San Francisco</span></p>
    <section class="agenda">
      <div class="row"><div class="t">7:00</div><div class="what">Doors + drinks</div></div>
      <div class="row"><div class="t">7:45</div><div class="what">Six demos, ten minutes each</div></div>
      <div class="row"><div class="t">9:30</div><div class="what">Afterglow</div></div>
    </section>
    <div class="rsvp">
      <a href="mailto:rsvp@signalnight.co">RSVP</a>
      <p>Space is tight. First replies hold the room.</p>
    </div>
    <footer>See you there</footer>
  </div>
</body>
</html>
