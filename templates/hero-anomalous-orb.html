<!-- desc: Dark hero with a spinning "anomalous matter" particle orb — thousands of depth-faded monochrome dots on an undulating sphere (canvas, no libs) behind a centered eyebrow / headline / sub-copy stack. 21st.dev AnomalousMatterHero style. Adapt: copy, orb size/speed/color. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anomalous Matter Hero</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #09090b; color: #fafafa; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }

    .hero { position: relative; height: 100vh; display: flex; align-items: center; justify-content: center; }

    #orb { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* soft dark pool behind the text so the copy stays legible over the orb */
    .hero::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 42% 30% at 50% 52%, rgba(9,9,11,0.72), rgba(9,9,11,0) 70%);
      pointer-events: none;
    }

    .copy { position: relative; z-index: 2; text-align: center; max-width: 680px; padding: 0 24px; }
    .eyebrow {
      font-size: 11px; letter-spacing: 5px; text-transform: uppercase;
      color: #a1a1aa; margin-bottom: 18px;
    }
    h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 700; line-height: 1.15; letter-spacing: -0.5px; }
    .sub { margin-top: 20px; font-size: 14px; line-height: 1.6; color: #a1a1aa; max-width: 460px; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body>
  <section class="hero">
    <canvas id="orb"></canvas>
    <div class="copy">
      <p class="eyebrow">Launch Sequence: Anomaly 12</p>
      <h1>Energy dances along unseen frontiers.</h1>
      <p class="sub">This demo shows how to override the default copy and integrate the hero into a page layout.</p>
    </div>
  </section>

  <script>
    const canvas = document.getElementById('orb');
    const ctx = canvas.getContext('2d');
    let W, H, DPR;

    function resize() {
      DPR = Math.min(2, window.devicePixelRatio || 1);
      W = canvas.clientWidth; H = canvas.clientHeight;
      canvas.width = W * DPR; canvas.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    resize();
    addEventListener('resize', resize);

    // Dense grainy shell: golden-spiral sphere + radial jitter so the orb
    // reads as a textured mass, not a see-through dot skin.
    const N = 9000;
    const pts = [];
    const GA = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2;           // -1..1
      const r = Math.sqrt(1 - y * y);
      const th = GA * i;
      const shell = 0.86 + Math.random() * 0.14; // thin volume, clumpy grain
      pts.push({
        x: Math.cos(th) * r * shell, y: y * shell, z: Math.sin(th) * r * shell,
        lat: Math.asin(y), lon: Math.atan2(Math.sin(th) * r, Math.cos(th) * r),
        ph: Math.random() * Math.PI * 2,
      });
    }

    function frame(now) {
      const t = now * 0.001;
      ctx.clearRect(0, 0, W, H);

      const R = Math.min(W, H) * 0.34;   // orb radius
      const cx = W / 2, cy = H * 0.52;
      const rotY = t * 0.18;             // the slow spin
      const cosR = Math.cos(rotY), sinR = Math.sin(rotY);

      for (const p of pts) {
        // organic "anomalous matter" undulation — layered waves per particle
        const w =
          0.10 * Math.sin(4 * p.lat + t * 0.9 + p.ph) * Math.cos(3 * p.lon - t * 0.7) +
          0.05 * Math.sin(9 * p.lon + t * 1.6) * Math.sin(6 * p.lat - t * 1.1);
        const d = 1 + w;

        // spin around Y
        let x = (p.x * cosR + p.z * sinR) * d;
        const y = p.y * d;
        let z = (-p.x * sinR + p.z * cosR) * d;

        // slight tilt for depth
        const ty = y * 0.94 - z * 0.10;
        z = y * 0.10 + z * 0.94;

        // perspective projection
        const persp = 2.6 / (2.6 + z);
        const sx = cx + x * R * persp;
        const sy = cy + ty * R * persp;

        // front particles brighter and bigger
        const front = 1 - (z + 1) / 2;
        const a = 0.10 + 0.72 * front * front;
        const s = (0.55 + 1.0 * front) * persp;

        ctx.fillStyle = `rgba(228,228,231,${a.toFixed(3)})`;
        ctx.fillRect(sx, sy, s, s);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
