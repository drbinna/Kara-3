<!-- desc: Bold athletic / sportswear storefront landing in the big-brand sports style: full-bleed hero with oversized condensed headline, category chips, a product grid (CSS color-block product tiles, no external images), and a strong CTA. Black/white with one accent, high contrast, all original — no real brand assets. Publish instantly with publish_template, swapping the strings below. Swappable strings: brand "VELOCE", eyebrow "NEW SEASON", hero headline "JUST MOVE", hero sub "Gear built for the ones who don't stop.", cta "Shop the drop", category chips "Running" / "Training" / "Lifestyle", product names "Aero Racer" / "Trail Beast" / "Court Classic" / "Street Knit", prices "$140" / "$165" / "$120" / "$95", footer line "VELOCE — move different.". -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELOCE</title>
<style>
  :root{--ink:#0a0a0a;--paper:#ffffff;--acc:#ff4d15;--mut:#8a8a8a;--line:#e6e6e6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Helvetica Neue',Arial,system-ui,sans-serif;color:var(--ink);background:var(--paper)}
  .cond{font-family:'Arial Narrow',Arial,sans-serif;font-stretch:condensed;letter-spacing:-.01em}
  nav{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);z-index:10}
  .brand{font-weight:900;font-size:24px;letter-spacing:-.04em;font-style:italic}
  nav .links{display:flex;gap:26px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  nav .links a{color:var(--ink);text-decoration:none}
  nav .links a:hover{color:var(--acc)}
  .hero{position:relative;background:var(--ink);color:#fff;min-height:78vh;display:flex;flex-direction:column;justify-content:flex-end;padding:56px 32px;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 70% 10%,#2a2a2a 0%,#0a0a0a 60%);z-index:0}
  .hero>*{position:relative;z-index:1}
  .eyebrow{font-size:13px;font-weight:800;letter-spacing:.3em;color:var(--acc)}
  .hero h1{font-family:'Arial Narrow',Arial,sans-serif;font-weight:900;font-size:clamp(4rem,17vw,12rem);line-height:.82;text-transform:uppercase;letter-spacing:-.02em;margin:10px 0 18px}
  .hero p{font-size:19px;max-width:440px;color:#d8d8d8;margin-bottom:26px}
  .btn{display:inline-block;background:#fff;color:var(--ink);text-decoration:none;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:14px;padding:16px 40px;border-radius:999px}
  .btn:hover{background:var(--acc);color:#fff}
  .chips{display:flex;gap:12px;padding:26px 32px;overflow-x:auto}
  .chip{border:1.5px solid var(--ink);border-radius:999px;padding:10px 22px;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;cursor:pointer}
  .chip:hover{background:var(--ink);color:#fff}
  .grid-head{padding:20px 32px 4px;display:flex;justify-content:space-between;align-items:baseline}
  .grid-head h2{font-family:'Arial Narrow',Arial,sans-serif;font-weight:900;font-size:clamp(1.8rem,4vw,2.8rem);text-transform:uppercase;letter-spacing:-.01em}
  .grid-head a{color:var(--acc);font-weight:700;font-size:14px;text-decoration:none;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px;padding:16px 32px 40px;background:var(--line)}
  .card{background:#fff;padding:0 0 18px;cursor:pointer}
  .swatch{aspect-ratio:1;display:flex;align-items:flex-end;padding:14px;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#fff}
  .s1{background:linear-gradient(135deg,#ff4d15,#7a1d00)}
  .s2{background:linear-gradient(135deg,#1e6b3a,#0a2a17)}
  .s3{background:linear-gradient(135deg,#2b4cff,#0a1a5e)}
  .s4{background:linear-gradient(135deg,#111,#3a3a3a)}
  .card .meta{padding:12px 14px 0}
  .card .name{font-weight:700;font-size:15px}
  .card .cat{color:var(--mut);font-size:13px;margin:2px 0 6px}
  .card .price{font-weight:800;font-size:15px}
  footer{background:var(--ink);color:#fff;text-align:center;padding:40px 24px;font-family:'Arial Narrow',Arial,sans-serif;font-weight:900;font-size:clamp(1.4rem,5vw,2.6rem);text-transform:uppercase;letter-spacing:-.01em}
</style>
</head>
<body>
  <nav>
    <div class="brand">VELOCE</div>
    <div class="links"><a href="#">New</a><a href="#">Men</a><a href="#">Women</a><a href="#">Sale</a></div>
  </nav>
  <header class="hero">
    <div class="eyebrow">NEW SEASON</div>
    <h1>Just Move</h1>
    <p>Gear built for the ones who don't stop.</p>
    <div><a class="btn" href="#shop">Shop the drop</a></div>
  </header>
  <div class="chips">
    <div class="chip">Running</div>
    <div class="chip">Training</div>
    <div class="chip">Lifestyle</div>
  </div>
  <div class="grid-head" id="shop">
    <h2>This week's drop</h2>
    <a href="#">View all</a>
  </div>
  <section class="grid">
    <div class="card"><div class="swatch s1">01</div><div class="meta"><div class="name">Aero Racer</div><div class="cat">Running</div><div class="price">$140</div></div></div>
    <div class="card"><div class="swatch s2">02</div><div class="meta"><div class="name">Trail Beast</div><div class="cat">Running</div><div class="price">$165</div></div></div>
    <div class="card"><div class="swatch s3">03</div><div class="meta"><div class="name">Court Classic</div><div class="cat">Lifestyle</div><div class="price">$120</div></div></div>
    <div class="card"><div class="swatch s4">04</div><div class="meta"><div class="name">Street Knit</div><div class="cat">Lifestyle</div><div class="price">$95</div></div></div>
  </section>
  <footer>VELOCE — move different.</footer>
</body>
</html>
