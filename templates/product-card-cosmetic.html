<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Card — Lumière</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#fff;
  --fg:#0a0a0a;
  --muted:#71717a;
  --muted-bg:#f4f4f5;
  --line:#e4e4e7;
  --primary:#18181b;
  --rose:#f43f5e;
  --amber:#f59e0b;
  --blue:#3b82f6;
  --emerald:#059669;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:#faf7f5;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:40px 16px;
  color:var(--fg);
  -webkit-font-smoothing:antialiased;
}

/* ---------- card ---------- */
.card{
  width:100%;max-width:384px;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 20px 40px rgba(0,0,0,.12);
  transition:box-shadow .3s;
}
.card:hover{box-shadow:0 10px 24px rgba(0,0,0,.10)}

/* ---------- carousel ---------- */
.media{position:relative;aspect-ratio:3/4;overflow:hidden;background:#f7ece9}
.media img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .3s ease;
}
.media img.on{opacity:1}

.nav{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:8px;
  opacity:0;transition:opacity .25s;
  pointer-events:none;
}
.card:hover .nav{opacity:1}
.nav button{
  pointer-events:auto;
  width:32px;height:32px;border-radius:50%;
  border:none;cursor:pointer;
  background:rgba(255,255,255,.8);
  backdrop-filter:blur(4px);
  box-shadow:0 1px 3px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;
  color:var(--fg);
  transition:background .2s;
}
.nav button:hover{background:#fff}
.nav svg{width:16px;height:16px}

.dots{
  position:absolute;bottom:12px;left:0;right:0;
  display:flex;justify-content:center;gap:6px;
}
.dots button{
  width:6px;height:6px;border-radius:999px;border:none;cursor:pointer;
  background:rgba(24,24,27,.3);
  transition:all .25s;
  padding:0;
}
.dots button.on{background:var(--primary);width:16px}

.badges{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:8px}
.badge{
  font-size:12px;font-weight:600;color:#fff;
  border-radius:6px;padding:3px 10px;width:max-content;
  letter-spacing:.01em;
}
.badge.new{background:var(--blue)}
.badge.best{background:var(--amber)}
.badge.off{background:var(--rose)}

.wish{
  position:absolute;top:12px;right:12px;
  width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.8);backdrop-filter:blur(4px);
  box-shadow:0 1px 3px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;
  color:var(--fg);
  transition:transform .15s,color .2s;
}
.wish:active{transform:scale(.88)}
.wish svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;transition:fill .2s}
.wish.on{color:var(--rose)}
.wish.on svg{fill:var(--rose);stroke:var(--rose)}

/* ---------- content ---------- */
.content{padding:16px;display:flex;flex-direction:column;gap:12px}
h3{font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:8px;margin-top:4px}
.stars{display:flex;align-items:center}
.stars svg{width:14px;height:14px;fill:var(--amber);stroke:var(--amber)}
.stars b{margin-left:4px;font-size:13.5px;font-weight:500}
.reviews{font-size:12px;color:var(--muted)}
.ship{font-size:12px;color:var(--emerald);margin-left:auto}

.price{display:flex;align-items:baseline;gap:8px}
.price .now{font-size:18px;font-weight:600}
.price .was{font-size:13.5px;color:var(--muted);text-decoration:line-through}

.opt-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.shades{display:flex;gap:8px}
.shade{
  width:24px;height:24px;border-radius:50%;border:none;cursor:pointer;
  box-shadow:0 0 0 1px var(--line);
  transition:box-shadow .2s;
}
.shade:hover{box-shadow:0 0 0 1px var(--primary)}
.shade.on{box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--primary)}

.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size{
  min-width:44px;height:32px;padding:0 10px;
  border-radius:6px;border:none;cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:500;
  background:rgba(244,244,245,.6);color:var(--fg);
  transition:background .2s,color .2s;
}
.size:hover{background:var(--muted-bg)}
.size.on{background:var(--primary);color:#fff}

/* ---------- footer ---------- */
.footer{padding:0 16px 16px}
.cart{
  width:100%;height:42px;
  border:none;border-radius:6px;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:500;
  background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:opacity .2s;
}
.cart:hover:not(:disabled){opacity:.9}
.cart:disabled{opacity:.6;cursor:default}
.cart svg{width:16px;height:16px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<script>
/* carousel */
const imgs = [...document.querySelectorAll('.media > img')];
const dots = document.getElementById('dots');
let idx = 0;
imgs.forEach((_, i) => {
  const d = document.createElement('button');
  d.setAttribute('aria-label', 'Go to image ' + (i + 1));
  d.addEventListener('click', (e) => { e.stopPropagation(); go(i); });
  dots.appendChild(d);
});
function go(i) {
  idx = (i + imgs.length) % imgs.length;
  imgs.forEach((im, k) => im.classList.toggle('on', k === idx));
  [...dots.children].forEach((d, k) => d.classList.toggle('on', k === idx));
}
document.getElementById('prev').addEventListener('click', (e) => { e.stopPropagation(); go(idx - 1); });
document.getElementById('next').addEventListener('click', (e) => { e.stopPropagation(); go(idx + 1); });
go(0);

/* wishlist */
const wish = document.getElementById('wish');
wish.addEventListener('click', (e) => { e.stopPropagation(); wish.classList.toggle('on'); });

/* shades */
const SHADES = ['#f5d0c5', '#e8a09a', '#c96f7b', '#8d3b47'];
const shadesEl = document.getElementById('shades');
SHADES.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'shade' + (i === 0 ? ' on' : '');
  b.style.backgroundColor = c;
  b.setAttribute('aria-label', 'Select shade ' + c);
  b.addEventListener('click', () => {
    [...shadesEl.children].forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
  });
  shadesEl.appendChild(b);
});

/* sizes */
const SIZES = ['15 ml', '30 ml', '50 ml', '100 ml'];
const sizesEl = document.getElementById('sizes');
SIZES.forEach((s) => {
  const b = document.createElement('button');
  b.className = 'size';
  b.textContent = s;
  b.addEventListener('click', () => {
    [...sizesEl.children].forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
  });
  sizesEl.appendChild(b);
});

/* add to cart */
const cart = document.getElementById('cart');
const CART_ICON = cart.innerHTML;
cart.addEventListener('click', () => {
  if (cart.disabled) return;
  cart.disabled = true;
  cart.innerHTML = '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg> Adding...';
  setTimeout(() => {
    cart.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Added to Cart';
    setTimeout(() => { cart.innerHTML = CART_ICON; cart.disabled = false; }, 2000);
  }, 800);
});
</script>
